version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      # Exclude certain local directories from overriding container ones
      - /app/venv
      - /app/scripts/node_modules
      - /app/__pycache__
    env_file:
      - ./backend/.env
    environment:
      # In dev, we might want to allow CORS for localhost:5173
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy   # ← waits for postgres to be ready before starting backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=http://localhost:8001
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
    ports:
      - "5173:80"
    # When developing locally, we typically don't mount React into the Nginx container,
    # but run 'npm run dev' locally. If using docker for frontend dev, an override is needed.
    # We will just expose the built production-like bundle in dev compose for easy testing.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resumeiq
    ports:
      - "5432:5432"              # ← DataGrip connects here
    volumes:
      - postgres_data:/var/lib/postgresql/data   # ← data survives restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
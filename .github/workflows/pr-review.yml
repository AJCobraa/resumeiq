name: Anupam's AI Reviewer Team

on:
  pull_request:
    types: [opened, synchronize, reopened]

# ── Shared diff generation ────────────────────────────────────────────────────
# The diff is generated once and passed to all three agents via a shared artifact.
# The three review jobs then run in PARALLEL, cutting total wall-clock time by ~66%.

jobs:
  # ── Step 0: Gatekeeper Check ────────────────────────────────────────────────
  branch-guard:
    name: Enforce Staging to Main
    runs-on: ubuntu-latest
    steps:
      - name: Check Source Branch
        run: |
          if [[ "${{ github.base_ref }}" == "main" && "${{ github.head_ref }}" != "staging" ]]; then
            echo "❌ ERROR: Direct merges to 'main' are restricted."
            exit 1 
          fi
          echo "✅ Branch flow verified."

  # ── Step 1: Generate diff once, upload as artifact ──────────────────────────
  generate-diff:
    name: Generate PR Diff
    needs: branch-guard
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      diff-ready: ${{ steps.check.outputs.ready }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6        # v6 is current stable;
        with:
          fetch-depth: 0                 # Required for cross-branch git diff

      - name: Generate diff
        run: |
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD \
            > /tmp/pr_diff.txt
          LINES=$(wc -l < /tmp/pr_diff.txt)
          echo "Diff size: ${LINES} lines"
          echo "ready=true" >> "$GITHUB_OUTPUT"
        id: check

      - name: Upload diff artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-diff
          path: /tmp/pr_diff.txt
          retention-days: 1              # Ephemeral — only needed for this workflow run


  # ── Step 2a: Security Agent ──────────────────────────────────────────────────
  security-review:
    name: Anupam's Security Team Agent
    needs: generate-diff
    runs-on: ubuntu-latest
    timeout-minutes: 10                  # Prevent runaway jobs
    permissions:
      pull-requests: write

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6    # v5 is current stable; v6 does not exist
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ai-reviewer-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-ai-reviewer-

      - name: Install dependencies
        run: pip install google-genai requests

      - name: Download diff artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-diff
          path: /tmp

      - name: Run Security Agent
        env:
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python scripts/pr_reviewer.py


  # ── Step 2b: Performance Agent ───────────────────────────────────────────────
  performance-review:
    name: Anupam's Performance Team Agent
    needs: generate-diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ai-reviewer-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-ai-reviewer-

      - name: Install dependencies
        run: pip install google-genai requests

      - name: Download diff artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-diff
          path: /tmp

      - name: Run Performance Agent
        env:
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python scripts/performance_reviewer.py


  # ── Step 2c: Design Agent (NEW) ───────────────────────────────────────────────
  design-review:
    name: Anupam's Design & Simplicity Team Agent
    needs: generate-diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ai-reviewer-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-ai-reviewer-

      - name: Install dependencies
        run: pip install google-genai requests

      - name: Download diff artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-diff
          path: /tmp

      - name: Run Design Agent
        env:
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python scripts/design_reviewer.py

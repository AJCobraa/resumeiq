name: Dependabot Safety Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  dependabot-review:
   # if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
        # 🚀 FIX: Uses Go CLI directly to avoid GitHub Action versioning errors
      - name: Install & Run OSV Scanner (CVE Check)
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
          ~/go/bin/osv-scanner --recursive --format=table ./ > /tmp/osv_results.txt || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 🚀 FIX: Uses Go CLI directly to avoid GitHub Action versioning errors
      - name: Install & Run OSV Scanner (CVE Check)
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
          ~/go/bin/osv-scanner --recursive --format=table ./ > /tmp/osv_results.txt || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install google-genai requests

      - name: Generate PR Diff
        run: |
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > /tmp/pr_diff.txt

      - name: Run AI Safety Agent
        env:
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          OSV_RESULTS: /tmp/osv_results.txt
        run: python scripts/dependabot_reviewer.py

name: Manual Deep Security Audit

on:
  workflow_dispatch: # This ensures it ONLY runs when manually triggered via the UI

permissions:
  contents: read

jobs:
  full_codebase_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install google-genai

      - name: Run Security Investigator Agent
        env:
           GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           REPO: ${{ github.repository }}
        run: python scripts/deep_security_review.py

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: Full-Security-Audit-Report
          path: security_audit_report.md
